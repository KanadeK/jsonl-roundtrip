name: Bug report
description: Report an incorrect result with a synthetic reproducer
body:
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include version, command, expected and observed behavior. Use synthetic inputs only.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Python version and operating system
    validations:
      required: true
